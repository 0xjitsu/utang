[package]
name = "utang"
version = "0.1.0"
edition = "2021"
description = "$UTANG: the neighbourhood trust game. A NEP-141 memecoin minted only by loans between neighbours."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# One "day" = 60 seconds instead of 24 hours (loan terms, bonus min age, pair cooldown).
demo-time = []

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
